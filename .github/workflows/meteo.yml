name: Pannello meteo Kindle

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  genera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dipendenze
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core
          pip install --quiet pillow ephem
      - name: Genera immagine
        run: python genera.py --out dashboard.png
      - name: Pubblica sul ramo png
        run: |
          mkdir out && cp dashboard.png out/ && cd out
          git init -q -b png
          git config user.name "meteo-bot"
          git config user.email "meteo-bot@users.noreply.github.com"
          git add dashboard.png
          git commit -q -m "aggiornamento $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" png
